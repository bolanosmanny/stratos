name: Verify Stratos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  browser-smoke:
    name: Browser protected-route smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unauthenticated browser test
        run: npx playwright test e2e/user-flows.spec.ts --grep "redirects unauthenticated"
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  backend:
    name: Backend tests and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests and write JUnit report
        run: |
          mkdir -p reports
          python -m pytest --junitxml=reports/junit.xml

      - name: Preserve JUnit report while demo server is offline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repropulse-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/reports/junit.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload JUnit report to ReproPulse
        if: always() && vars.REPROPULSE_LIVE == 'true' && vars.REPROPULSE_ENDPOINT != ''
        uses: ./actions/upload-junit
        with:
          endpoint: ${{ vars.REPROPULSE_ENDPOINT }}
          ingestion-token: ${{ secrets.REPROPULSE_INGESTION_TOKEN }}
          report-path: backend/reports/junit.xml
          workflow-run-id: ${{ github.run_id }}

      - name: Compile backend source
        run: python -m compileall main.py routers services scripts
