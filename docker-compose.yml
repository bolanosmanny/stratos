services:
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      HF_HOME: /models/huggingface
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - huggingface_cache:/models/huggingface
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
    huggingface_cache:
    ollama_models:
